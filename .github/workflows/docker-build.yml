name: Docker Build and Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - version: 8.2
            path: images/8.2
          - version: 8.3
            path: images/8.3
          - version: 8.5
            path: images/8.5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login zu GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract PHP version
        run: |
          PHP_VERSION=$(grep FROM ${{ matrix.path }}/Dockerfile | cut -d: -f2 | cut -d- -f1)
          echo "PHP_VERSION=$PHP_VERSION" >> $GITHUB_ENV

      - name: Build und Push (PHP ${{ matrix.version }})
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          push: true
          tags: |
            ghcr.io/wikibear/fullyws:${{ matrix.version }}
            ghcr.io/wikibear/fullyws:${{ env.PHP_VERSION }}
            ghcr.io/wikibear/fullyws:${{ matrix.version }}-${{ github.sha }}
            ${{ matrix.version == '8.5' && 'ghcr.io/wikibear/fullyws:latest' || '' }}

  all-builds-done:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Confirm builds
        run: echo "All builds completed"
