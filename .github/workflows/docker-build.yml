name: Docker Build and Push

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      matrix:
        include:
          - version: 8.2
            path: images/8.2
          - version: 8.3
            path: images/8.3
          - version: 8.5
            path: images/8.5
            latest: true

    outputs:
      built: ${{ steps.set-output.outputs.built }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Normalize repo name
        id: repo
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          OWNER=$(echo "$REPO" | cut -d/ -f1)
          IMAGE=$(echo "$REPO" | cut -d/ -f2)

          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          BASE=$(grep FROM ${{ matrix.path }}/Dockerfile | awk '{print $2}')
          VERSION=$(echo $BASE | cut -d: -f2 | cut -d- -f1)
          MAJOR=$(echo $VERSION | cut -d. -f1,2)

          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT

      - name: Get digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect ${{ steps.meta.outputs.base }} --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Cache digest
        id: cache
        uses: actions/cache@v4
        with:
          path: digest-${{ matrix.version }}
          key: digest-${{ matrix.version }}-${{ steps.digest.outputs.digest }}

      - name: Should build?
        id: changed
        run: |
          if [ -f digest-${{ matrix.version }} ]; then
            echo "build=false" >> $GITHUB_OUTPUT
          else
            echo "build=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine PHP version
        if: steps.changed.outputs.build == 'true'
        id: php
        run: |
          PHP_VERSION=$(docker run --rm ${{ steps.meta.outputs.base }} php -r 'echo PHP_VERSION;')
          echo "php_version=$PHP_VERSION" >> $GITHUB_OUTPUT

      - name: Build and Push
        if: steps.changed.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/${{ steps.repo.outputs.image }}:${{ steps.php.outputs.php_version }}
            ghcr.io/${{ steps.repo.outputs.owner }}/${{ steps.repo.outputs.image }}:${{ steps.meta.outputs.major }}
            ghcr.io/${{ steps.repo.outputs.owner }}/${{ steps.repo.outputs.image }}:${{ steps.php.outputs.php_version }}-${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.owner }}/${{ steps.repo.outputs.image }}:${{ steps.meta.outputs.major }}-${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.owner }}/${{ steps.repo.outputs.image }}:${{ github.sha }}
            ${{ matrix.latest && format('ghcr.io/{0}/{1}:latest', steps.repo.outputs.owner, steps.repo.outputs.image) || '' }}

      - name: Scan Image
        if: steps.changed.outputs.build == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ steps.repo.outputs.owner }}/${{ steps.repo.outputs.image }}:${{ steps.php.outputs.php_version }}
          format: table
          exit-code: 0

      - name: Save digest
        if: steps.changed.outputs.build == 'true'
        run: |
          echo "${{ steps.digest.outputs.digest }}" > digest-${{ matrix.version }}

      - name: Track builds
        id: set-output
        run: |
          if [ "${{ steps.changed.outputs.build }}" == "true" ]; then
            echo "built=true" >> $GITHUB_OUTPUT
          else
            echo "built=false" >> $GITHUB_OUTPUT
          fi
