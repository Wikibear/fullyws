name: Docker Build and Release

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write

    strategy:
      matrix:
        include:
          - version: 8.2
            path: images/8.2
          - version: 8.3
            path: images/8.3
          - version: 8.5
            path: images/8.5
            latest: true

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # ✅ FIX: Repo lowercase
      - name: Normalize repo name
        id: repo
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$REPO" >> $GITHUB_OUTPUT

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🔍 Base Image + Version
      - name: Extract metadata
        id: meta
        run: |
          BASE=$(grep FROM ${{ matrix.path }}/Dockerfile | awk '{print $2}')
          VERSION=$(echo $BASE | cut -d: -f2 | cut -d- -f1)
          MAJOR=$(echo $VERSION | cut -d. -f1,2)

          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT

      # 🔍 Digest holen
      - name: Get digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect ${{ steps.meta.outputs.base }} --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      # 💾 Cache
      - name: Cache digest
        id: cache
        uses: actions/cache@v4
        with:
          path: digest-${{ matrix.version }}
          key: digest-${{ matrix.version }}-${{ steps.digest.outputs.digest }}

      # 🧠 Entscheidung
      - name: Should build?
        id: changed
        run: |
          if [ -f digest-${{ matrix.version }} ]; then
            echo "build=false" >> $GITHUB_OUTPUT
          else
            echo "build=true" >> $GITHUB_OUTPUT
          fi

      # 🏗️ Build + Push
      - name: Build and Push
        if: steps.changed.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo }}/php-${{ steps.meta.outputs.major }}:latest
            ghcr.io/${{ steps.repo.outputs.repo }}/php-${{ steps.meta.outputs.major }}:${{ steps.meta.outputs.version }}
            ${{ matrix.latest && format('ghcr.io/{0}/php:latest', steps.repo.outputs.repo) || '' }}

      # 🔐 Security Scan (Trivy)
      - name: Scan Image
        if: steps.changed.outputs.build == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ steps.repo.outputs.repo }}/php-${{ steps.meta.outputs.major }}:${{ steps.meta.outputs.version }}
          format: table
          exit-code: 0

      # 📝 PHP Changelog holen
      - name: Fetch PHP changelog
        id: changelog
        if: steps.changed.outputs.build == 'true'
        run: |
          VERSION=${{ steps.meta.outputs.version }}
          NOTES=$(curl -s https://www.php.net/ChangeLog-$VERSION.php | head -n 40 || echo "No changelog found")
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 📝 Release
      - name: Create Release
        if: steps.changed.outputs.build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: php-${{ steps.meta.outputs.major }}-${{ steps.meta.outputs.version }}
          name: PHP ${{ steps.meta.outputs.major }} → ${{ steps.meta.outputs.version }}
          body: |
            🚀 Automated Docker rebuild triggered

            ## 📦 Base Image
            `${{ steps.meta.outputs.base }}`

            ## 🐳 Docker Tags
            - ghcr.io/${{ steps.repo.outputs.repo }}/php-${{ steps.meta.outputs.major }}:${{ steps.meta.outputs.version }}
            - ghcr.io/${{ steps.repo.outputs.repo }}/php-${{ steps.meta.outputs.major }}:latest

            ## 🔐 Security Scan
            ✅ Trivy scan completed

            ## 📜 PHP Changes
            ${{ steps.changelog.outputs.notes }}

      # 💾 Save Digest
      - name: Save digest
        if: steps.changed.outputs.build == 'true'
        run: |
          echo "${{ steps.digest.outputs.digest }}" > digest-${{ matrix.version }}
