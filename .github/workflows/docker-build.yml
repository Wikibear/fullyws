name: Docker Build and Release

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # wichtig für Releases!
      packages: write

    strategy:
      matrix:
        include:
          - version: 8.2
            path: images/8.2
          - version: 8.3
            path: images/8.3
          - version: 8.5
            path: images/8.5

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🔍 Base Image + Version holen
      - name: Extract base + version
        id: meta
        run: |
          BASE=$(grep FROM ${{ matrix.path }}/Dockerfile | awk '{print $2}')
          VERSION=$(echo $BASE | cut -d: -f2 | cut -d- -f1)

          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 🔍 Digest prüfen
      - name: Get digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect ${{ steps.meta.outputs.base }} --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      # 💾 Cache
      - name: Cache digest
        id: cache
        uses: actions/cache@v4
        with:
          path: digest-${{ matrix.version }}
          key: digest-${{ matrix.version }}-${{ steps.digest.outputs.digest }}

      # 🧠 Check Änderung
      - name: Should build?
        id: changed
        run: |
          if [ -f digest-${{ matrix.version }} ]; then
            echo "build=false" >> $GITHUB_OUTPUT
          else
            echo "build=true" >> $GITHUB_OUTPUT
          fi

      # 🏗️ Build + Push
      - name: Build and Push
        if: steps.changed.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/php-${{ matrix.version }}:latest
            ghcr.io/${{ github.repository }}/php-${{ matrix.version }}:${{ steps.meta.outputs.version }}

      # 📝 Release Notes
      - name: Create Release
        if: steps.changed.outputs.build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: php-${{ matrix.version }}-${{ steps.meta.outputs.version }}
          name: PHP ${{ matrix.version }} → ${{ steps.meta.outputs.version }}
          body: |
            🚀 New PHP base image detected

            Base image: `${{ steps.meta.outputs.base }}`
            Version: `${{ steps.meta.outputs.version }}`

            Docker image:
            ghcr.io/${{ github.repository }}/php-${{ matrix.version }}:${{ steps.meta.outputs.version }}

      # 💾 Save digest
      - name: Save digest
        if: steps.changed.outputs.build == 'true'
        run: |
          echo "${{ steps.digest.outputs.digest }}" > digest-${{ matrix.version }}
