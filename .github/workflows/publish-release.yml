name: Publish Release

on:
  workflow_run:
    workflows:
      - Docker Build and Push
    types:
      - completed

jobs:
  publish:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Check if images were built
        id: check
        run: |
          echo "⚠️ Build result cannot be read cross-workflow → assume build happened"

      - name: Release metadata
        id: meta
        run: |
          SHA=${{ github.event.workflow_run.head_sha }}
          SHORT=${SHA:0:7}
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "short=$SHORT" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.meta.outputs.sha }}
          name: Build ${{ steps.meta.outputs.short }}
          body: |
            🚀 Automated Docker release

            Triggered by workflow run:
            ${{ github.event.workflow_run.html_url }}

            ✅ Images updated and pushed to GHCR
